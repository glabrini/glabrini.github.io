<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giovanni Labrini · Turbomachinery CFD</title>
  <meta name="description" content="Personal research page of Giovanni Labrini, PhD candidate in turbomachinery CFD at Politecnico di Torino: film cooling, aerothermal analysis, unsteady flow in high-pressure turbines.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <nav class="topbar" aria-label="Sections">
    <div class="wrap">
      <a href="#top">Home</a>
      <a href="#about">About</a>
      <a href="#news">News</a>
      <a href="#publications">Publications</a>
      <a href="#skills">Skills</a>
    </div>
  </nav>

  <header class="hero wrap" id="top">
    <img class="photo" id="photo" alt="Portrait of Giovanni Labrini" width="160" height="160" hidden>
    <div class="hero-text">
      <h1 id="name"></h1>
      <p class="title" id="title"></p>
      <p class="affiliation" id="affiliation"></p>
      <p class="tagline" id="tagline"></p>
      <div class="links" id="links"></div>
    </div>

    <section id="about">
      <h2>About</h2>
      <div id="about-text"></div>
      <ul class="chips" id="interests" aria-label="Research interests"></ul>

    <section id="news">
      <h2>News</h2>
      <ul id="news-list"></ul>
    </section>

    <section id="publications">
      <h2>Publications <small id="pub-count"></small></h2>
      <div class="pub-tools">
        <div class="filters" id="pub-filters" role="group" aria-label="Filter by type"></div>
        <input id="pub-search" type="search" placeholder="Search publications…" aria-label="Search publications">
      </div>
      <ol class="pub-list" id="pub-list"></ol>
    </section>

    <section id="skills">
      <h2>Skills</h2>
      <div class="skill-groups" id="skill-groups"></div>
    </section>

  <footer>
    <div class="wrap">© <span id="year"></span> <span id="footer-name"></span>. All content is edited in <code>assets/data.js</code>.</div>
  </footer>

  <noscript><p class="wrap">Please enable JavaScript to view this page.</p></noscript>
  <script src="assets/data.js"></script>
  <script src="assets/main.js"></script>
